version: 2
project_name: bb

before:
  hooks:
    - go mod tidy

builds:
  - id: bb
    main: ./cmd/bb
    binary: bb
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/uehatsu/bb/internal/build.Version={{.Version}}
      - -X github.com/uehatsu/bb/internal/build.Date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "bb_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

brews:
  - name: bb
    repository:
      owner: uehatsu
      name: homebrew-tap
    homepage: https://github.com/uehatsu/bb
    description: "Bitbucket Cloud CLI with GitHub CLI ergonomics"
    license: MIT
    install: |
      bin.install "bb"
      generate_completions_from_executable(bin/"bb", "completion")
    test: |
      system "#{bin}/bb", "version"
